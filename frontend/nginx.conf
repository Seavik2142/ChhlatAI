server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Allow up to 50MB uploads (e.g. ABA payment slips, product photos)
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Health check endpoint
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Dynamic Docker DNS resolution (prevents stale container IP on restart)
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream "http://backend:8000";

    # Proxy API and WebSocket requests to FastAPI backend
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Request headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent WebSocket dropouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Proxy uploaded media files
    location /uploads/ {
        proxy_pass $backend_upstream/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing - fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
