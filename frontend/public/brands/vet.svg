    <text x="22" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" font-size="21" font-weight="900" font-style="italic" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">VET</text>
  </g>
  
