      <stop offset="0%" stop-color="#1A365D"/>
      <stop offset="100%" stop-color="#0F213D"/>
    </linearGradient>
    <linearGradient id="vet-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#vet-bg)"/>
  
  <!-- Speed lines & VET monogram -->
