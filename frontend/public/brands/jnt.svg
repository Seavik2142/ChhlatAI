  <text x="32" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" fill="#D60012" text-anchor="middle" letter-spacing="1.2">EXPRESS</text>
