      <stop offset="0%" stop-color="#FF1D25"/>
      <stop offset="100%" stop-color="#D60012"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#jnt-bg)"/>
  
  <!-- J&T Italic Bold Typography -->
  <g fill="#FFFFFF" transform="translate(8, 14)">
    <text x="24" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Impact', 'Arial Black', sans-serif" font-size="22" font-style="italic" font-weight="900" text-anchor="middle" letter-spacing="-1">J&amp;T</text>
  </g>
  
  <!-- EXPRESS white pill banner -->
