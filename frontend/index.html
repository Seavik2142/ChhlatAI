<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />
    <title>Chhlat AI — AI Social Commerce CRM</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem("chhlat_theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (savedTheme === "dark" || (!savedTheme && prefersDark) || (savedTheme === "system" && prefersDark)) {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
          }

          var savedLang = localStorage.getItem("chhlat_lang");
          if (savedLang === "km") {
            document.documentElement.lang = "km";
            document.documentElement.setAttribute("data-lang", "km");
            document.documentElement.classList.add("font-khmer");
          } else {
            document.documentElement.lang = "en";
            document.documentElement.setAttribute("data-lang", "en");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
